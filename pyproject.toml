[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoteam"
version = "0.6.2"
description = "Dynamic multi-agent team formation framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "networkx>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "streamlit>=1.30",
    "httpx>=0.27",
]
ui = ["streamlit>=1.30"]

[tool.setuptools]
packages = [
    "app",
    "app.models",
    "app.analyzer",
    "app.allocator",
    "app.llm",
    "app.topology",
    "app.scheduler",
    "app.evaluation",
    "app.demo",
    "app.runtime",
    "app.tools",
    "app.api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
