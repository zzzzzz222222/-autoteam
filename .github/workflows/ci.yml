name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No API key, no network dependency, no database, no external service:
      # every step below runs against the offline rule-based analyzer and the
      # deterministic mock executor.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: UI import smoke test
        run: python -c "import app.demo.app; print('UI module OK')"

      - name: Offline demos
        run: |
          python main.py "Create a market research report for a new AI product."
          python examples/topology_demo.py
          python examples/scheduler_demo.py
          python examples/recovery_demo.py
          python examples/evaluation_demo.py
